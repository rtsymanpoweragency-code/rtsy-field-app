<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#102746"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json"><title>RTSY Field Evaluation</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#102746;font:16px system-ui}header{background:#102746;color:white;padding:24px}header b{font-size:32px;color:#dfbd70}main{max-width:850px;margin:auto;padding:18px}section{background:white;border-radius:14px;padding:20px;margin-bottom:16px}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #c4ccd6;border-radius:8px;width:100%}textarea{min-height:85px}button{background:#102746;color:white;margin:5px 0;cursor:pointer}button.alt{background:white;color:#102746}canvas{width:100%;height:140px;border:1px solid #aab4c2;touch-action:none;background:white}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}small{color:#526174}h2{margin-top:0} @media print{.no-print,button{display:none!important}body{background:white}section{break-inside:avoid;padding:8px}header{padding:10px}main{padding:0}input,textarea,select{border:0;padding:4px}textarea{display:none}.printtext{display:block!important;white-space:pre-wrap}canvas{max-width:350px}}.printtext{display:none}</style><header><img src="icon.png" alt="RTSY logo" style="width:72px;height:72px;border-radius:12px;vertical-align:middle;margin-right:16px"><b>RTSY</b><div>RECRUITMENT OPC · FIELD SERVICES</div></header><main><section class="no-print"><h2>Field dashboard</h2><div id="count"></div><div class="row"><button onclick="fresh()">New evaluation</button><button class="alt" onclick="backup()">Export records</button></div><label>Restore backup (merges records)</label><input type="file" accept=".json" id="restore"></section><form id="form"><section><h2 id="heading">Evaluation</h2><label>Form type</label><select id="type"><option value="employee">Employee performance evaluation</option><option value="client">Client satisfaction survey</option><option value="meeting">Client visit & meeting report</option></select><div class="row"><div><label>Reference</label><input id="ref" readonly></div><div><label>Visit date</label><input id="date" type="date" required></div></div><label>Client company</label><input id="client" list="clients" required><datalist id="clients"></datalist><label>Branch / location</label><input id="branch"><div id="employee"><label>Employee name / position</label><input id="subject"></div><label>Client representative / designation</label><input id="rep" required><label>RTSY representative / designation</label><input id="staff" required></section><section><h2>Evaluation details</h2><div id="questions"></div><label>Discussion / concerns / feedback</label><textarea id="notes"></textarea><label>Agreed action plan</label><textarea id="action"></textarea><label>Person responsible</label><input id="owner"><label>Target completion date</label><input id="due" type="date"><label>Next visit</label><input id="next" type="date"></section><section><h2>Acknowledgment</h2><p>Signatures acknowledge the recorded discussion and agreed actions.</p><label>Client signature</label><canvas id="sig1" width="1000" height="280"></canvas><button type="button" class="alt" onclick="clearSig('sig1')">Clear client signature</button><label>RTSY signature</label><canvas id="sig2" width="1000" height="280"></canvas><button type="button" class="alt" onclick="clearSig('sig2')">Clear RTSY signature</button></section><section class="no-print"><button type="submit">Save signed record</button><button type="button" class="alt" onclick="printReport()">Print / Save as PDF</button><small id="status"></small></section></form><section class="no-print"><h2>Evaluation history</h2><input id="search" placeholder="Search client or reference"><div id="history"></div></section></main><script>
const $=id=>document.getElementById(id), key='rtsy.records.v1', fields=['type','ref','date','client','branch','subject','rep','staff','notes','action','owner','due','next'];let records=[];try{records=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};const qs={employee:['Attendance and punctuality','Quality of work','Productivity','Professionalism','Grooming and uniform','Compliance with instructions'],client:['Quality of manpower services','Employee reliability','RTSY responsiveness','Replacement efficiency','Billing and documentation','Overall satisfaction'],meeting:['Purpose of visit','Previous concerns / status','New discussion items']};const titles={employee:'Employee Performance Evaluation',client:'Client Satisfaction Survey',meeting:'Client Visit & Meeting Report'};const clients=[];clients.forEach(x=>{let o=document.createElement('option');o.value=x;$('clients').append(o)});function questions(){let t=$('type').value;$('heading').textContent=titles[t];$('employee').hidden=t!=='employee';$('questions').replaceChildren();qs[t].forEach((q,i)=>{let l=document.createElement('label');l.textContent=q;let el=document.createElement(t==='meeting'?'textarea':'select');el.id='q'+i;if(t!=='meeting')['Not assessed','1 — Poor','2 — Fair','3 — Satisfactory','4 — Very good','5 — Excellent','N/A'].forEach(v=>{let o=document.createElement('option');o.textContent=v;el.append(o)});$('questions').append(l,el)})} $('type').onchange=questions;function clearSig(id){let c=$(id);c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.signed=''};for(let id of ['sig1','sig2']){let c=$(id),ctx=c.getContext('2d'),drawing=false;ctx.lineWidth=4;ctx.lineCap='round';function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};c.onpointermove=e=>{if(drawing){ctx.lineTo(...point(e));ctx.stroke();c.dataset.signed='1'}};c.onpointerup=c.onpointercancel=()=>drawing=false}function fresh(){ $('form').reset();$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);$('ref').value='RTSY-EVL-'+new Date().getFullYear()+'-'+Date.now().toString(36).toUpperCase();questions();clearSig('sig1');clearSig('sig2');$('status').textContent='New unsaved record'}function collect(){let r={};fields.forEach(f=>r[f]=$(f).value);r.answers=qs[r.type].map((q,i)=>({q,a:$('q'+i).value}));for(let id of ['sig1','sig2'])r[id]=$(id).dataset.signed?$(id).toDataURL():'';return r}function persist(next){try{localStorage.setItem(key,JSON.stringify(next));records=next;return true}catch(e){alert('Storage failed. Export a backup and free space.');return false}}$('form').onsubmit=e=>{e.preventDefault();let r=collect();if(!r.sig1||!r.sig2){alert('Both signatures are required.');return}if(r.type==='employee'&&!r.subject.trim()){alert('Enter employee name and position.');return}if(records.some(x=>x.ref===r.ref)){alert('This reference is already saved. Create a new evaluation for changes.');return}if(persist([r,...records])){$('status').textContent='Saved on this device. Export backup to Google Drive.';historyView()}};function historyView(){$('count').textContent=records.length+' saved evaluations';$('history').replaceChildren();let s=$('search').value.toLowerCase();records.filter(r=>(r.client+' '+r.ref).toLowerCase().includes(s)).forEach(r=>{let b=document.createElement('button');b.className='alt';b.textContent=r.date+' · '+r.client+' · '+titles[r.type]+' · '+r.ref;b.onclick=()=>load(r);$('history').append(b)})}function load(r){fields.forEach(f=>$(f).value=r[f]||'');questions();r.answers.forEach((a,i)=>$('q'+i).value=a.a);for(let id of ['sig1','sig2']){clearSig(id);if(r[id]){let im=new Image();im.onload=()=>{$(id).getContext('2d').drawImage(im,0,0);$(id).dataset.signed='1'};im.src=r[id]}}$('status').textContent='Saved record loaded. Original record is not overwritten.';window.scrollTo(0,0)}$('search').oninput=historyView;function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records)],{type:'application/json'}));a.download='RTSY-backup-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('restore').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.every(r=>r&&typeof r.ref==='string'&&typeof r.client==='string'&&Array.isArray(r.answers)&&titles[r.type]))throw Error();let m=new Map(records.map(r=>[r.ref,r]));data.forEach(r=>{if(!m.has(r.ref))m.set(r.ref,r)});if(persist([...m.values()]))historyView()}catch(e){alert('Invalid backup file')}};function printReport(){if(!$('form').reportValidity())return;document.querySelectorAll('.printtext').forEach(x=>x.remove());document.querySelectorAll('textarea').forEach(x=>{let p=document.createElement('div');p.className='printtext';p.textContent=x.value;x.after(p)});window.print()}fresh();historyView();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
